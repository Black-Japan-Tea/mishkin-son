<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Liquid Glass: графитовый фон, стеклянная плитка, синий месяц (сон) + изумрудная точка (еда) -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#D8DCE1"/>
      <stop offset="1" stop-color="#C7CCD3"/>
    </linearGradient>
    <linearGradient id="moon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4AA3EF"/>
      <stop offset="1" stop-color="#1C90ED"/>
    </linearGradient>
    <filter id="tile-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#0F172A" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- фон: full-bleed (maskable safe) -->
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- liquid-свечения -->
  <circle cx="60" cy="60" r="200" fill="#1C90ED" opacity="0.14"/>
  <circle cx="470" cy="470" r="210" fill="#10B981" opacity="0.12"/>

  <!-- стеклянная плитка (в safe-zone maskable ~r205) -->
  <g filter="url(#tile-shadow)">
    <rect x="112" y="112" width="288" height="288" rx="80" fill="#FFFFFF" fill-opacity="0.55"/>
  </g>
  <rect x="112" y="112" width="288" height="288" rx="80" fill="none" stroke="#FFFFFF" stroke-opacity="0.7" stroke-width="3"/>
  <!-- блик по верхнему краю плитки -->
  <path d="M196 122h120" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="6" stroke-linecap="round"/>

  <!-- месяц (сон): тонкий серп — круг с большим вырезом через mask -->
  <mask id="mcut">
    <rect x="96" y="96" width="320" height="320" fill="#fff"/>
    <circle cx="336" cy="178" r="80" fill="#000"/>
  </mask>
  <circle cx="247" cy="266" r="80" fill="url(#moon)" mask="url(#mcut)"/>
  <!-- точка (еда) — в центре выреза -->
  <circle cx="330" cy="182" r="20" fill="#10B981"/>
  <circle cx="324" cy="176" r="6" fill="#FFFFFF" fill-opacity="0.55"/>
</svg>
